{% extends "base.html" %}
{% block title %}로그인 | VIBE-FASHION{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container" style="max-width: 560px;">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <h1 class="h4 mb-3">로그인</h1>
                <p class="text-muted mb-4">소셜 계정으로 간편하게 로그인하세요.</p>

                {% if error %}
                <div class="alert alert-danger" role="alert">
                    로그인 처리 중 문제가 발생했습니다. 다시 시도해 주세요. ({{ error }})
                    {% if error_description %}
                    <div class="mt-2 small">상세: {{ error_description }}</div>
                    {% endif %}
                </div>
                {% endif %}

                <div class="d-grid gap-3">
                    <a class="btn btn-primary btn-lg" href="{{ url_for('auth.microsoft_login') }}">Microsoft로 로그인</a>
                    <button class="btn btn-outline-warning btn-lg" type="button" disabled>카카오 로그인 (준비중)</button>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
